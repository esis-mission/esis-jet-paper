name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
        ]
        python-version: ["3.12", "3.13"]
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }} test
    steps:
      - name: Install LaTeX
        # `apt-get` waits forever if another process on the runner holds the
        # dpkg lock, so bound that wait and answer its prompts non-interactively.
        # The index the runner ships with goes stale, and installing against a
        # stale one asks the mirror for versions it has since replaced.
        run: >-
          sudo apt-get update -o DPkg::Lock::Timeout=300 &&
          sudo apt-get install -y -o DPkg::Lock::Timeout=300
          texlive-publishers texlive-science cm-super latexmk libcairo2-dev
          dvipng
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Test with pytest
        run: |
          pip install pytest-cov
          pytest --cov=. --cov-report=xml
      - name: Upload the article
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: article
          path: esis_jet_paper/esis-jet.pdf
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
